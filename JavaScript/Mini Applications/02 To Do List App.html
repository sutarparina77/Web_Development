<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List App</title>
    <link rel="stylesheet" href="02Style.css">
</head>
<body>
    <div class="todo-container">
        <h1>📝 To-Do List</h1>
        <p class="subtitle">Add tasks and stay productive!</p>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="What do you need to do?">

            <button onclick="addTask()">Add Task +</button>
        </div>

        <div class="filter-buttons">

            <button onclick="showAll()">All</button>

            <button onclick="showPending()">Pending</button>

            <button onclick="showCompleted()">Completed</button>

        </div>

        <ul id="taskList"></ul>

        <div class="summary">

            <div class="summary-box total">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>

            <div class="summary-box pending">
                <h3>Pending</h3>
                <p id="pendingTasks">0</p>
            </div>

            <div class="summary-box completed">
                <h3>Completed</h3>
                <p id="completedTasks">0</p>
            </div>

        </div>

        <button class="clear-btn" onclick="clearCompleted()">
            Clear Completed 🗑
        </button>

    </div>
    
    <script src="02Script.js"></script>

</body>
</html>
