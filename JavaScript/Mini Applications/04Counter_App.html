<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Interactive Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background: #f5f7ff;
        }

        .card {
            background: wheat;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
        }

        h2{
            font-size: 40px;
            font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            margin-bottom: 30px;
        }

        .btn {
            padding: 10px 24px;
            background: #1a237e;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            margin: 5px;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #e65100;
        }

        #counter {
            font-size: 48px;
            font-weight: bold;
            color: #1a237e;
            margin-bottom: 20px;
        }

        #name-display {
            margin-top: 15px;
            font-size: 18px;
            color: #333;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Counter App</h2>
        <div id="counter">0</div> 
        <button class="btn" id="inc">+ Increment</button> 
        <button class="btn" id="dec">- Decrement</button> 
        <button class="btn" id="reset">Reset</button>
        <hr style="margin:20px 0"> 
        <input type="text" id="nameInput" placeholder="Type your name...">
        <div id="name-display">Hello, Guest!</div>
    </div>
    <script>    
        // Counter    
        let count = 0;    
        const display = document.getElementById("counter");    
        document.getElementById("inc").addEventListener("click", () => 
        {      
            count++;      
            display.textContent = count;      
            display.style.color = count > 0 ? "#2e7d32" : "#b71c1c";    
        });    
        document.getElementById("dec").addEventListener("click", () => 
        {      
            count--;      
            display.textContent = count;      
            display.style.color = count > 0 ? "#2e7d32" : "#b71c1c";    
        });    
        document.getElementById("reset").addEventListener("click", () => 
        {      
            count = 0;      
            display.textContent = count;      
            display.style.color = "#1a237e";
        }); 
        document.getElementById("nameInput").addEventListener("input", (e) => 
        { 
            let val = e.target.value.trim(); document.getElementById("name-display").textContent = val ? `Hello, ${val}!` : "Hello, Guest!"; 
        }); 
    </script>
</body>

</html>
