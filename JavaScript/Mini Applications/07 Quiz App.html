<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="./07Style.css">
</head>
<body>
    <div class="quiz-card" id="quiz-card">
        <div class="header">
            <span class="progress" id="progress">Question 1 of 5</span>
            <span class="timer" id="timer">&#9201; 15s</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
        <div class="question" id="question"></div>
        <div class="options" id="options"></div>
        <button class="next-btn" id="next-btn">Next &rarr;</button>
    </div>

    <script src="./07Script.js"></script>
</body>
</html>
