<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display-Inline</title>
    <style>
        .box, .Container{
            display: inline;
            background-color: brown;
            margin: 15px;
            padding: 10px;
        }
    </style>
</head>

<body>
    <div class="box">Inline Element</div>
    <div class="box">Next Element</div>
    <div class="Container">No at new line !!</div>
</body>

</html>
