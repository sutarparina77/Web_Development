<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display-Block</title>
    <style>
        .box, .Container{
            display: block;
            height: 100px;
            width: 100px;
            background-color: seagreen;
            padding: 20px;
            margin: 20px;
        }
    </style>
</head>

<body>
    <div class="box">Block Element</div>
    <div class="box">Next Element</div>
    <div class="Container">Block Property sorting each block element at new line !!</div>
</body>

</html>
