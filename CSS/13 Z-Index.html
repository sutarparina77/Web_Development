<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Index</title>
    <style>
        .box1{
            position: absolute;
            top: 40px;
            left: 40px;
            width: 150px;
            height: 150px;
            background-color: cadetblue;
            z-index: 1;
        }
        .box2{
            position: absolute;
            top: 100px;
            left: 100px;
            width: 150px;
            height: 150px;
            background-color: rgb(133, 125, 219);
            z-index: 2;
        }
        .box3{
            position: absolute;
            top: 160px;
            left: 160px;
            width: 150px;
            height: 150px;
            background-color: rgb(101, 187, 114);
            z-index: 3;
        }
    </style>
</head>
<body>
    <div class="box1">Box 1</div>
    <div class="box2">Box 2</div>
    <div class="box3">Box 3</div>
</body>
</html>
