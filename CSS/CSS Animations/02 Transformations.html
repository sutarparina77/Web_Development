<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            padding: 30px;
            background-color:azure;
        }
        .Box1, .Box2, .Box3, .Box4, .Box5, .Box6{
            display: flex;
            background-color: rgb(165, 219, 167);
            height: 100px;
            width: 100px;
            border-radius: 10px;
            justify-content: center;
            align-items: center;
            color: rgb(25, 34, 27);
            transition: transform 1s ease;
        }
        .Box1:hover{
            transform: translateX(50px);
        }
        .Box2:hover{
            transform: translateY(40px);
        }
        .Box3:hover{
            transform: scale(1.5);
            /* transform: scaleX(1.5); */
            /* transform: scaleY(1.5); */
        }
        .Box4:hover{
            transform: rotate(40deg);
        }
        .Box5:hover{
            transform: skew(56deg);
            /* transform: skewX(56deg); */
            /* transform: skewY(56deg); */
        }
        .Box6:hover{
            transform: scale(1.5) rotate(60deg);
        }
    </style>
</head>
<body>
    <h2>CSS Animations</h2>
    <div class="parent">
        <div class="Box1">Box1</div><br><br>
        <div class="Box2">Box2</div><br><br>
        <div class="Box3">Box3</div><br><br>
        <div class="Box4">Box4</div><br><br>
        <div class="Box5">Box5</div><br><br>
        <div class="Box6">Box6</div>
    </div>
</body>
</html>
