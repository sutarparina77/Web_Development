<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .vhBox{
            height: 20vh;       /* y coordinate */
            width: 40vw;        /* x coordinate */
            background-color: rgb(224, 154, 48);
        }
        .vwBox{
            width: 50vw;
            height: 20vw;
            background-color: rgb(55, 227, 227);
        }
    </style>
</head>
<body>
    <div class="vhBox">Height = 20vh </div>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing.</p>
    <div class="vwBox">width = 20vw </div>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing.</p>
</body>
</html>
