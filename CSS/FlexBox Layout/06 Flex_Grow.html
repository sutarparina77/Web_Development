<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Grow</title>
    <style>
        .container{
            display: flex;
        }
        .items-1{
            flex-grow: 1;
            background-color:darkgoldenrod ;
        }
        .items-2{
            flex-grow: 2;
            background-color:rgb(233, 143, 70) ;
        }
        .items-3{
            flex-grow: 3;
            background-color:rgb(81, 59, 4) ;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items-1 box">1</div>
        <div class="items-2 box">2</div>
        <div class="items-3 box">3</div>
    </div>
</body>
</html>
