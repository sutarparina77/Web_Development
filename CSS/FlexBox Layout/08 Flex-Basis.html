<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Basis</title>
    <style>
        .container{
            display: flex;
            background-color: violet;
        }
        
        .box{
            height: 50px;
            flex-basis: 250px;
            background-color: brown;
            margin: 5px;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
    </div>
</body>
</html>
