<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Shrink</title>
    <style>
        .container{
            display: flex;
            width: 200px;
        }
        .items-1{
            width: 150px;
            flex-shrink: 0;
            background-color: turquoise;
        }
        .items-2{
            width: 100px;
            background-color: rgb(122, 39, 181);
        }
        .box{
            height: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items-1 box">1</div>
        <div class="items-2 box">2</div>
    </div>
</body>
</html>
