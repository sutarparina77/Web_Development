<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padding</title>
</head>
<body>
    <h3>Padding Properties</h3>
    <div style="padding-top: 20px; background-color: bisque;">padding-top</div><br>
    <div style="padding-bottom: 30px; background-color: rgb(189, 112, 18);"">padding-bottom</div><br>
    <div style="padding-left: 40px; background-color: rgb(125, 110, 224);">padding-left</div><br>
    <div style="padding-right: 50px; background-color: rgb(64, 166, 206);"">padding-right</div><br>
    
    <h3>Padding Shorthand</h3>
    <div style="padding: 15px; background-color: cadetblue;">When single value applying all around.</div><br>
    <div style="padding: 30px 20px; background-color: cadetblue;">When applying 2 values top-bottom left-right</div><br>
    <div style="padding: 10px 40px 30px; background-color: cadetblue;">When applying 3 values top left-right bottom</div><br>
    <div style="padding: 20px 30px 40px 50px; background-color: cadetblue;">When applying 4 values top right bottom left</div>

</body>
</html>
