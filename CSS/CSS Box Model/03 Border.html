<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border</title>
</head>
<body>
    <div style="border: 5px solid rgb(181, 54, 54); padding: 20px;">Solid Border</div><br>
    <div style="border: 5px dotted black; padding: 20px;">Dotted Border</div><br>
    <div style="border: 5px dashed rgb(30, 184, 102); padding: 20px;">Dashed Border</div><br>
    <div style="border: 5px double rgb(219, 46, 181); padding: 20px;">Double Border</div><br>
    <div style="border: 10px groove rgb(61, 12, 158); padding: 20px;">Groove Border</div>
</body>
</html>
