<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin</title>
</head>
<body>
    <h3>Margin Properties</h3>
    <div style="margin-top: 20px; background-color: bisque;">Margin-top</div><br>
    <div style="margin-bottom: 30px; background-color: rgb(189, 112, 18);">Margin-bottom</div><br>
    <div style="margin-left: 40px; background-color: rgb(125, 110, 224);">Margin-left</div><br>
    <div style="margin-right: 50px; background-color: rgb(64, 166, 206);">Margin-right</div><br>
    
    <h3>Margin Shorthand</h3>
    <div style="margin: auto; background-color: cadetblue;">Auto Margin</div><br>
    <div style="margin: 15px; background-color: cadetblue;">When single value applying all around.</div><br>
    <div style="margin: 30px 20px; background-color: cadetblue;">When applying 2 values top-bottom left-right</div><br>
    <div style="margin: 10px 40px 30px; background-color: cadetblue;">When applying 3 values top left-right bottom</div><br>
    <div style="margin: 20px 30px 40px 50px; background-color: cadetblue;">When applying 4 values top right bottom left</div>
</body>
</html>
