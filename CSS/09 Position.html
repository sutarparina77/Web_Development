<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <style>
        .box1{
            height: 200px;
            width: 200px;
            border: 1px solid black;
            background-color: rgb(255, 175, 148);
            padding: 10px;
            /* position:static; */
            position:relative;
            top: 5px;
            /* right: 10px; */
        }

        .parent{
            position: relative;
            height: 150px;
            width: 150px;
            background-color: aquamarine;
        }

        .child{
            position:absolute;
            background-color: rgb(32, 61, 51);
            color: aliceblue;
            /* top: 50px; */
            /* right: 20px; */
            /* left: 20px; */
            bottom: 20px;
        }

        .box2{
            height: 200px;
            width: 200px;
            border: 1px solid black;
            background-color: rgb(178, 62, 23);
            padding: 10px;
            position:fixed;
            top: 35px;
            right: 30px;
        }

    </style>
</head>

<body>
    <div class="box1">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Sit, dolorem!</div><br>
    <div class="parent">Parent
        <div class="child">Child</div>
    </div><br>
    <div class="box2">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Sit, dolorem!</div>
</body>

</html>
