<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorthand</title>
    <style>
        .container{
            display: grid;
            background-color: rgb(221, 174, 112);
            /* grid-template-columns:repeat(5, 200px); */
            grid-template-rows: repeat(7,80px);
        }
        .item{
            background-color: rgb(8, 127, 52);
            border: 1px solid rgb(70, 24, 8);
            padding: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
     <div class="container">
        <div class="item">Box 1</div>
        <div class="item">Box 2</div>
        <div class="item">Box 3</div>
        <div class="item">Box 4</div>
        <div class="item">Box 5</div>
        <div class="item">Box 6</div>
        <div class="item">Box 7</div>
        <div class="item">Box 8</div>
        <div class="item">Box 9</div>
        <div class="item">Box 10</div>
    </div>
</body>
</html>
