<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid-template-Row</title>
    <style>
        .container{
            display: grid;
            background-color: antiquewhite;
            grid-template-columns: 1fr 1fr 1fr 1fr;
        }
        .item{
            background-color: blueviolet;
            border: 1px solid navajowhite;
            padding: 15px;
            text-align: center;
        }
        .parent{
            display: grid;
            grid-template-columns: 1fr 1fr 200px;
            grid-template-rows: 100px 150px 30px;
            /* gap: 10px; */
            row-gap: 10px;
            /* column-gap: 10px; */
            background-color: thistle; 
        }
        .child{
            background-color: teal;
            color: white;
            border: 1px solid black;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Box 1</div>
        <div class="item">Box 2</div>
        <div class="item">Box 3</div>
        <div class="item">Box 4</div>
        <div class="item">Box 5</div>
        <div class="item">Box 6</div>
        <div class="item">Box 7</div>
        <div class="item">Box 8</div>
    </div><br><br>
    <div class="parent">
        <div class="child">Box 1</div>
        <div class="child">Box 2</div>
        <div class="child">Box 3</div>
        <div class="child">Box 4</div>
        <div class="child">Box 5</div>
        <div class="child">Box 6</div>
        <div class="child">Box 7</div>
        <div class="child">Box 8</div>
    </div>
</body>
</html>
