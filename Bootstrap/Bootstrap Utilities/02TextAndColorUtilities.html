<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text and Color Utilities</title>
    <link rel="stylesheet" href="./bootstrap.min.css">
</head>
<body>
    <p class="bg-danger text-center">Center Text</p><br>
    <p class="bg-success text-md-start text-end">End Text</p>
    <p class="bg-danger text-uppercase">uppercase Text</p>
    <p class="bg-success text-lowercase">lowercase Text</p>
    <p class="bg-danger fw-bold">Bold Text</p>
    <p class="bg-success fw-light fst-italic">Italic and light Text</p>

    <p class="text-primary">Primary color Text</p>
    <p class="text-danger">Danger color Text</p>

</body>
</html>
