<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display and Flex Utilities</title>
    <link rel="stylesheet" href="./bootstrap.min.css">
</head>
<body>
    <div class="d-block bg-primary">Block</div><br>
    <div class="d-inline bg-primary">inline</div><br>
    <div class="d-none bg-primary">None</div><br>
    <div class="d-none d-md-block bg-primary">None</div><br>

    <div class="d-flex bg-primary">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
    </div><br>
    <div class="d-grid bg-primary">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
    </div><br>
     <div class="d-inline-flex bg-primary">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
    </div><br><br>
     <div class="d-inline-block bg-primary">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
     </div>
</body>
</html>
