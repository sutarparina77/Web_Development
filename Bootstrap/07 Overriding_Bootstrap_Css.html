<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overriding Bootstrap Css</title>
    <link rel="stylesheet" href="./bootstrap.min.css">
    <style>
        :root{
            --bs--primary:rgb(130, 187, 18);
            --bs-fork:rgb(184, 189, 192);
        }
        .btn-primary{
            background-color: var(--bs--primary);
        }
        .fork{
            background-color: var(--bs-fork);
            color: var(--bs--primary);
        }
    </style>
</head>

<body>
    <div class="container">
        <button class="btn btn-primary mt-3">Submit</button>
        <button class="btn fork">Click Me</button>
    </div><br>
    <div style="background-color: var(--bs-fork);">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Atque,
        numquam consequatur blanditiis ex impedit suscipit.</div>
</body>

</html>
