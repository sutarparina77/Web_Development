<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <link rel="stylesheet" href="./bootstrap.min.css">
</head>

<body>
    <div class="container-fluid">
        <table class="table table-bordered border-warning">

            <tr class="table-primary">
                <th>Name</th>
                <th>Course</th>
            </tr>
            <tr class="table-success">
                <td>Harry</td>
                <td>B.Tech</td>
            </tr>
            <tr class="table-warning">
                <td>Jack</td>
                <td>BCA</td>
            </tr>
            <tr class="table-danger">
                <td>Leo</td>
                <td>BCS</td>
            </tr>
        </table>

        <table class="table table-bordered border-info">

            <tr>
                <th class="table-primary">Name</th>
                <th class="table-secondary">Course</th>
            </tr>
            <tr>
                <td class="table-success">Harry</td>
                <td  class="table-dark">B.Tech</td>
            </tr>
            <tr>
                <td class="table-warning">Jack</td>
                <td class="table-info">BCA</td>
            </tr>
            <tr>
                <td class="table-danger">Leo</td>
                <td class="table-light">BCS</td>
            </tr>
        </table>
    </div>
</body>

</html>
