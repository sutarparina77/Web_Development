<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iframe Implementation</title>
</head>
<body>
    <header>Iframe Tag</header>
    <p>An iframe (Inline Frame) is an HTML element used to embed another HTML document or external content directly inside your current webpage.</p>

    <section>
        <iframe src="https://en.wikipedia.org/wiki/Website" frameborder="4" height="300" width="300" title="wikipedia Website"></iframe><br>
        
        <iframe src="https://www.youtube.com/embed/A0yG4rG2Q0U?si=iIQBgCaZr_yIThOh" title="YouTube video player" frameborder="1" allow="accelerometer; autoplay; gyroscope;" width="560" height="315"></iframe>
    </section>
</body>
</html>
