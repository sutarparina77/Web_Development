<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        th,td{
            text-align: center;
            padding: 10px;
        }
        .Calc{
            margin:500px;
            margin-top: 100px;
            margin-bottom: 100px;
            height:500px;
            width:500px;
            border: 2px solid black;
            border-collapse: collapse;
            background-color: rgb(239, 222, 202);
        }
        .NumberBox{
            text-align: end;
        }
        .ArrowBox, .ClearBox, .OperatorBox{
            background-color: rgb(224, 5, 5);
            color: white;
        }
        .EqualBox{
            background-color: rgb(21, 198, 21);
            color: white;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }
        
    </style>
</head>
<body>
    <table class="Calc" border="1px" style="border-collapse: collapse; ">
        <tr>
            <th></th>
            <th colspan="10" class="NumberBox">0</th>
        </tr>

        <tr>
            <td>mod</td>
            <td colspan="5">
                <label for="deg">deg</label>
                <input type="radio" name="Calc" id="deg" value="deg">

                <label for="rad">rad</label>
                <input type="radio" name="Calc" id="rad" value="rad">
            </td>
            <td>MC</td>
            <td>MR</td>
            <td>MS</td>
            <td>M+</td>
            <td>M-</td>
        </tr>

        <tr>
            <td>sinh</td>
            <td>cosh</td>
            <td>tanh</td>
            <td>Exp</td>
            <td>(</td>
            <td>)</td>
            <td colspan="2" class="ArrowBox">←</td>
            <td class="ClearBox">C</td>
            <td class="OperatorBox">+/-</td>
            <td>√</td>
        </tr>

        <tr>
            <td>sinh<sup>-1</sup></td>
            <td>cosh<sup>-1</sup></td>
            <td>tanh<sup>-1</sup></td>
            <td>log<sub>2</sub>x</td>
            <td>ln</td>
            <td>log</td>
            <td>7</td>
            <td>8</td>
            <td>9</td>
            <td>/</td>
            <td>%</td>
        </tr>

        <tr>
            <td>π</td>
            <td>e</td>
            <td>n!</td>
            <td>log<sub>y</sub>x</td>
            <td>e<sup>x</sup></td>
            <td>10<sup>x</sup></td>
            <td>4</td>
            <td>5</td>
            <td>6</td>
            <td>*</td>
            <td>1/x</td>
        </tr>

        <tr>
            <td>sin</td>
            <td>cos</td>
            <td>tan</td>
            <td>X<sup>y</sup></td>
            <td>X<sup>3</sup></td>
            <td>X<sup>2</sup></td>
            <td>1</td>
            <td>2</td>
            <td>3</td>
            <td>-</td>
            <td rowspan="2" class="EqualBox">=</td>
        </tr>

        <tr>
            <td>sin<sup>-1</sup></td>
            <td>cos<sup>-1</sup></td>
            <td>tan<sup>-1</sup></td>
            <td><sup>y</sup>√</td>
            <td><sup>3</sup>√</td>
            <td>|X|</td>
            <td colspan="2">0</td>
            <td>.</td>
            <td>+</td>
        </tr>
    </table>
</body>
</html>
