<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Member</title>
</head>
<body>
    <form action="">
        <h3>Update Member</h3>
        <label for="">Username :</label>
        <input type="text" name="Username" placeholder="Enter Username" minlength="12" maxlength="20"><br><br>

        <label for="">Password :</label>
        <input type="password" name="password" placeholder="Enter password" minlength="6" maxlength="8"><br><br>

        <label for="">Full Name :</label>
        <input type="text" name="Full name" placeholder="Enter full name" minlength="20" maxlength="60"><br><br>

        <label for="">Email :</label>
        <input type="email" name="email" placeholder="Enter email ID" minlength="20" maxlength="30"><br><br>

        <label for="">Mobile No. :</label>
        <input type="number" name="mobile" placeholder="Enter mobile no." maxlength="10"><br><br>

        <label for="">Address :</label>
        <textarea name="Address" id="Address" rows="5" cols="20"></textarea><br><br>

        <button>Update</button>
        <button>Delete</button>
    </form>
</body>
</html>
