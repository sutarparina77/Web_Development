<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register New Member</title>
</head>
<body>
    <form action="">
        <h3>Register New Member</h3>
        <label for="">Full Name :</label>
        <input type="text" name="Full Name" placeholder="Enter full name here" minlength="20" maxlength="60"><br><br>

        <label for="">Email :</label>
        <input type="email" name="email" placeholder="Enter email ID here" minlength="20" maxlength="30"><br><br>

        <label for="">Mobile No. :</label>
        <input type="number" name="Mobile" placeholder="Enter mobile no. here" minlength="10" maxlength="10"><br><br>

        <label for="">Gender :</label>

        <input type="radio" name="Gender" value="Male">
        <label for="">Male</label>

        <input type="radio" name="Gender" value="Female">
        <label for="">Female</label>

        <input type="radio" name="Gender" value="Other">
        <label for="">Other</label><br><br>

        <label for="">Address :</label>
        <textarea value="Address" rows="5" cols="20"></textarea><br><br>
        
        <label for="">Designation</label>
        <select name="" id="">
            
            <option value="" type="selected">Select option</option>
            <option value="">Principle</option>
            <option value="">Teacher</option>
            <option value="">staff</option>

        </select><br><br>

        <label for="">Department</label>
        <select name="" id="">

            <option value="" selected>Select Option</option>
            <option value="">Arts</option>
            <option value="">Commerce</option>
            <option value="">Science</option>
            <option value="">Account</option>

        </select><br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>



    </form>
</body>
</html>
