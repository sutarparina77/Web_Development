<!doctype html>
<html> 
 <head> 
  <title>Form Tag</title> 
 </head> 
 <body> 
  <form> <label for="">Enter Name</label> 
   <input type="text" pattern="[A-Za-z]" title="Please enter only alphabets"> 
   <button>Submit</button> 
  </form> 
  <br>
  <form>
   <label for="">Enter Mobile Number</label> 
   <input type="Number" pattern="[0-9]{10}" title="Please enter only 10 digits Number">
   <button>Submit</button> 
  </form> 
  <br>
  <form>
   <label for="">Enter Pincode</label> 
   <input type="text" pattern="[0-9]{6}" title="Please enter only 6 digit Pincode">
   <button>Submit</button> 
  </form> 
</body>
</html>
