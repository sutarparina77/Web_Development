<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Table</title>
</head>
<body>
    <table border="1" height="200px" width="250px" style="border-collapse: collapse ; text-align: center;">

        <tr>
            <th colspan="2">1</th>
            <th width="100px">1</th>
            <th width="100px">1</th>
        </tr>
        
        <tr>
            <td colspan = "2" rowspan="2" align="center" width="200px"> 

                <table border="1" height="100px" width="100px" style="border-collapse: collapse ; text-align: center;">
            
                <tr>
                    <td>1</td>
                    <td>1</td>
                    <td>1</td>
                    <td>1</td>
                </tr>

                <tr>
                    <td>1</td>
                    <td>1</td>
                    <td>1</td>
                    <td>1</td>
                </tr>

                <tr>
                    <td>1</td>
                    <td>1</td>
                    <td>1</td>
                    <td>1</td>
                </tr>

                <tr>
                    <td>1</td>
                    <td>1</td>
                    <td>1</td>
                    <td>1</td>
                </tr>

                </table>
            </td>

                <td width="150px">1</td>
                <td width="150px">1</td>
        </tr>

        <tr>
            <td>1</td>
            <td>1</td>
        </tr>

        <tr>
            <td colspan="2" heigt= "100px">1</td>
            <td heigt= "100px" width="150px">1</td>
            <td heigt= "100px" width="150px">1</td>
        </tr>

        <tr>
            <td colspan="2" heigt= "100px">1</td>
            <td heigt= "100px" width="150px">1</td>
            <td heigt= "100px" width="150px">1</td>
        </tr>

    </table>
    
</body>
</html>
